# ETK: pin the DP/HDMI capture sink to S16_LE.
# The SM8250 DP port's S24_LE path loses ~25 dB (bit-alignment in the q6 DSP
# path; convicted by controlled A/B tones 2026-08-07: S16 raw = clipping roof,
# S24 raw = sub-30% meter — dossiers/WlMirrorTeardown_20260807.md). PipeWire
# otherwise negotiates S24 and every capture arrives quiet — the "had to add
# +1000% gain in OBS" bug. Inert during normal speaker/headphone use; applies
# only to the HDMI/DP profile sink used for capture audio.
# Deployed by install.sh STEP 6.75 (kill-switch ETK_DP_AUDIO_S16=0 in etk.conf).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output._sys_devices_platform_sound_sound_card0.HDMI__HDMI__sink" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
