# ETK: pin every capture node of the SM8250 sound card to S16_LE / 48 kHz / 2 ch.
# The q6 DSP capture path is a bit-exact passthrough whose backend is FIXED at that
# format (sm8250_be_hw_params_fixup); PipeWire otherwise negotiates S24 and the
# capture is garbage: on the Flip 2 the 3.5 mm headset mic read as -17.7 dBFS of
# white noise at S24 and as a clean -67 dBFS floor at S16 on the same route
# (ollamadreno, 2026-09-29). Same class as the DP S16 pin (50-etk-dp-audio-s16.conf).
# Covers the headset jack mic and the ETK internal mic (STEP 6.76). Playback is
# untouched. Deployed by install.sh STEP 6.75 (kill-switch ETK_CAPTURE_S16=0).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input._sys_devices_platform_sound_sound_card0.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]
