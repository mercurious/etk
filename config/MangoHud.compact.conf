# ==========================================================
# ETK MangoHud — COMPACT dash  (Pitstop TOOLS > HUD dash: compact)
# ==========================================================
# The DDU master (MangoHud.conf) in MangoHud's compact form, with more
# instruments. bin/hud_apply.sh builds the top/bottom/off punchbox stops from
# THIS file instead of the master when the dash is compact (scripts/env.sh:
# ETK_HUD_VIEW), and the bridge writes the LEAN body (TEMP|ANTI-LOCK|VAULT)
# into the ETK field: the LOAD/RAM gauges the other bodies carry are native
# instruments here.
#   hud_compact   drops units and padding. Values are only as wide as they
#                 are (GPU 8% vs 80%), so what follows them shifts; that's
#                 the price of the width it saves.
#   battery       icon + % + draw in watts (battery_watt: the fuel gauge's
#                 current x voltage; car8's current_now read 5x low while
#                 charging on 2026-10-10, so trust the watts on battery only).
#   gpu_stats     Adreno load % + the core clock (gpu_core_clock: the OPP the
#                 POWER tab caps, 800 MHz on the shipped profile).
#   ram           system RAM used (MangoHud's own; vram reads 0 on this rig).
# Same control socket, ETK field and per-frame CSV as the master: the
# postmortem's fps/frametime ledger columns read that CSV whatever the dash.
control=mangohud
no_display=0
position=bottom-left
font_file=/usr/share/fonts/liberation/LiberationMono-Regular.ttf
font_size=34
font_size_secondary=34
background_alpha=0.6
text_outline=1
text_color=00FF00
battery_color=00A000
gpu_color=00A000
ram_color=00A000

hud_compact
horizontal
legacy_layout=0
table_columns=3

battery_icon
battery
battery_watt
fps
frame_timing
frametime=0
gpu_stats
gpu_core_clock
ram

custom_text=ETK
exec=cat /dev/shm/etk_shm/live_stat.txt
exec_interval=100

output_folder=/dev/shm/etk_shm/mangolog
log_interval=0
autostart_log=1
