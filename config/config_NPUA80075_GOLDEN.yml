Audio:
  # SWITCH: Moving from Null to OpenSL (Native Android/Linux Audio)
  Renderer: OpenSL
  # OPTIMIZATION: Increasing buffer to 100ms to tolerate SPU jitter
  Audio Buffer: 350
  # NEW: Downmix to Stereo to save SPU mixing cycles
  Channels: 2.0
Core:
  PPU Threads: 2          
  # INCREASED: We need an extra thread for SPU-Audio synthesis
  Preferred SPU Threads: 3 
  SPU Block Size: Safe    
  # CRITICAL: Approximate accuracy is mandatory to keep audio sync on SM8250
  SPU XFloat Accuracy: Approximate
  # BALANCING: We want SPU threads fast, but not starving the PPU
  Lower SPU Priority: false 
Video:
  Renderer: Vulkan
  Resolution: 1280x720
  Resolution Scale: 100   
  Resolution Scale Threshold: 512 
  Write Color Buffers: true
  Strict Rendering Mode: false  
  Shader Mode: Async (with Shader Interpreter)
  Shader Precision: Low
  # NEW: Enable Frame Limit to 30 to prevent the CPU from over-reaching
  Frame limit: 30
  Aspect ratio: 16:9
  Output Scaling Mode: Bilinear
  VSync: false             
  Multithreaded RSX: true  
  RSX FIFO Accuracy: Ordered
  ZCULL Accuracy: Relaxed
  #NEW
  Vblank Frequency: 60Hz
  Vulkan:
    Adapter: Turnip Adreno (TM) 650
    Asynchronous Queue Scheduler: Safe
    Asynchronous Texture Streaming: true
    Exclusive Fullscreen Mode: Automatic
    Force primitive restart flag: false
    Use Re-BAR for GPU uploads: true
    VRAM allocation limit (MB): 65536