# ==========================================================
# ETK PHASE 4: HUD MASTER (v11.1.0 - LEAN RAM DISK)
# ==========================================================
no_display=0
control=mangohud
position=top-left
font_size=46
background_alpha=0.6
text_outline=1
text_color=00FF00

# --- LAYOUT OPTIMIZATION ---
horizontal
legacy_layout=0
table_columns=3

# --- NATIVE RIG SENSORS ---
fps
# cpu_temp taller bar required?
# gpu_temp
battery

# --- ETK TITANIUM FIELD (THE BRAIN) ---
# REBUILD 1: Pulls from native volatile RAM Disk
custom_text=---
exec=cat /dev/shm/etk_shm/live_stat.txt
exec_interval=100