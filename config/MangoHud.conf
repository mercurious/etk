# ==========================================================
# ETK PHASE 4: HUD MASTER (v11.1.0 - LEAN RAM DISK)
# ==========================================================
no_display=0
control=mangohud
position=bottom-left
font_size=46
font_size_secondary=46   # was implicitly ~25 (0.55×); now matches native
# --- FONT TEST: Liberation Mono (OS image, reflash-safe) ---
font_file=/usr/share/fonts/liberation/LiberationMono-Regular.ttf
# no font_glyph_ranges needed — ° · ± × ! » + are all Latin-1/ASCII
background_alpha=0.6
text_outline=1
text_color=00FF00

# --- LAYOUT OPTIMIZATION ---
horizontal
legacy_layout=0
table_columns=3
# round_corners=3

# --- NATIVE RIG SENSORS ---
frame_timing		# frametime graph
fps
# gpu_stats         # never seen peaking above 50% during testing, takes up lot of space
battery				
# cpu_stats 		# always pinned to 100%
# vram			    # always says 0.GB 
# ram
# cpu_temp taller bar required?
# gpu_temp

# --- ETK TITANIUM FIELD (THE BRAIN) ---
# REBUILD 1: Pulls from native volatile RAM Disk
custom_text=ETK
exec=cat /dev/shm/etk_shm/live_stat.txt
exec_interval=100

# --- G-INSTR: FPS/FRAMETIME READBACK (the gauge) ---
# MangoHud already computes fps/frametime in the present path; these knobs
# spill them to a per-session CSV that session_postmortem.sh parses at exit
# into the ledger's fps_med/fps_1low/ft_p99_ms columns. The folder lives in
# volatile SHM (seeded by mango_bridge.sh, pruned by the postmortem; the
# curve is archived to etk_telemetry/mango_logs/ first).
# Col1=fps, col2=frametime(ms); scene-transition present-spikes
# (frametime<4ms) are filtered downstream — never mean-average the fps column.
#
# log_interval=0 = PER-FRAME rows (was 1000 = 1Hz samples). The roadfeel
# detector needs within-second cadence texture — locked-16.7ms streaks vs
# 60<->30 vsync-flip judder are invisible at 1Hz (operator-validated gap,
# 2026-07-04: GT HD 'perfect vs slushy' moments). ~54k rows / 15 min session
# ~= 3MB in SHM; postmortem parses per-frame fine (same schema, more rows)
# and ft_jitter_ms becomes TRUE adjacent-frame jitter (what its spec always
# claimed). Ledger changeover epoch for cross-era jitter comparisons:
# 2026-07-04 ~16:30 EDT.
output_folder=/dev/shm/etk_shm/mangolog
log_interval=0
autostart_log=1