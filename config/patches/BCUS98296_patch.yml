# ETK — per-title patch file for Gran Turismo 6 (BCUS98296 and the other v01.22
# executables). RPCS3 (ARMSX3 base) loads <TITLE_ID>_patch.yml from its patches
# directory beside the community patch.yml; the kit deploys this file as
# /storage/.config/rpcs3/patches/BCUS98296_patch.yml (install.sh STEP 6.5545,
# bin/etk_patch_seed.py) and enables both patches for BCUS98296 ONCE, so a
# choice you make afterwards in Pitstop TUNING > PATCH stands. The kit's GT6
# tune already runs with Write/Read Color Buffers off, which "Disable MLAA"
# requires. Kill-switch ETK_GT6_PATCHES=0 removes the file.
#
# Source: ARMSX3 android/armsx3-ui/app/src/main/assets/canary_patches.yml
# (commits be4815cd7 + 17abaabdd, 2026-10-07; GPL-2.0), patches by illusion,
# brought to ARMSX3 by mlgprorektm8. Reproduced unchanged below.
#
Version: 1.2

# GRAN TURISMO 6 v01.22 (BCUS99247, BCUS98296) -- illusion's patches, brought to ARMSX3 by
# mlgprorektm8, who confirmed them on the North American and Latin American releases.
#
# Disable MLAA: the game reads every frame back for its MLAA pass, so it only renders correctly
# with Write and Read Color Buffers on, and those cost a lot of frame time. The patch turns MLAA
# off, and the core then switches both buffer settings off for the run, since nothing needs them
# any more (patch_engine::apply, Utilities/bin_patch.cpp).
# Disable Motion Blur: without it replays and track intros render black.
#
# Keyed by PPU hash, so they apply only to the executables listed: every GT6 v01.22 executable we
# know of. They share one layout, since RPCS3's database patches the six it knows at the same
# addresses. mlgprorektm8 confirmed these on PPU-4f1e9acd... (BCUS98296) and PPU-42367707...
# (BCUS99247). A tester confirmed them on PPU-6ac472e1..., the BCUS98296 executable RPCS3's
# database lists. With MLAA on, his game fell to 1 fps a few minutes in and wedged: the RSX waited a
# full second every frame on a label nothing cleared, the same wedge Soulcalibur V has without its
# own Disable MLAA. The other five from that database are here on the strength of the shared layout.
PPU-42367707f4caac2668f10cb46498f64bde9db440:
  "Disable MLAA":
    Games:
      "Gran Turismo 6":
        BCUS99247: [ 01.22 ]
    Author: "illusion"
    Notes: "Turns off the game's MLAA pass, which needed Write and Read Color Buffers. ARMSX3 turns both off while this patch is on."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x00ED2E88, 0x39E00001 ]
  "Disable Motion Blur":
    Games:
      "Gran Turismo 6":
        BCUS99247: [ 01.22 ]
    Author: "illusion"
    Notes: "Fixes the black screen in replays and track intros."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x008C2B4C, 0x38600000 ]

