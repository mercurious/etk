# ==========================================================
# ETK MangoHud — DEFAULT/minimal preset  (punchbox state 3 of 4)
# ==========================================================
# The "default config" stop in the R1+L3 punchbox cycle: a clean, stock-style
# readout — fps + frametime graph only, NO ETK DDU exec line. Deployed to
# $ETK_ROOT/config/MangoHud.default.conf and copied over the live conf by
# bin/hud_apply.sh when the operator cycles to the "default" state.
# (top/bottom = the full ETK DDU; off = no_display=1.)
no_display=0
control=mangohud
position=top-left
font_size=42
font_file=/usr/share/fonts/liberation/LiberationMono-Regular.ttf
background_alpha=0.4
text_outline=1

horizontal
legacy_layout=0

fps
frame_timing
