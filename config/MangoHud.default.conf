# ==========================================================
# ETK MangoHud — DEFAULT view  (punchbox state 3 of 4)
# ==========================================================
# The "default" stop in the R1+L3 punchbox cycle: MangoHud's standard
# out-of-box readout — the FULL stock HUD (gpu/cpu load + temps + memory + fps
# + frametime graph), NOT a minimized fps-only view and NOT the ETK DDU.
# Operator-preferred over the earlier minimized default (2026-07-07).
#
# The widget set below IS MangoHud's default; only the FONT is bumped for the
# Flip 2's high-DPI panel (the stock default size is unreadably small there),
# and control= is set so the R1+L3 live-reload socket keeps working. On this
# rig some stock stats are known-quirky (cpu_stats can pin 100%, vram can read
# 0) — that is stock MangoHud behavior, kept here deliberately.
control=mangohud
font_file=/usr/share/fonts/liberation/LiberationMono-Regular.ttf
font_size=32
background_alpha=0.4
text_outline=1

fps
frame_timing
gpu_stats
gpu_temp
vram
cpu_stats
cpu_temp
ram
