<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:scp;src:url('file:///Library/Fonts/SourceCodePro-Bold.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
/* narrow lower-left block: left of 1/3 width, lifted 120px to clear a bottom HUD */
.card{position:absolute;left:54px;bottom:120px;max-width:560px;
  font-family:scp,monospace;
  background:linear-gradient(120deg,rgba(3,11,17,.60) 0%,rgba(3,11,17,.42) 70%,rgba(3,11,17,0) 100%);
  border-left:3px solid #2bff7e;border-radius:3px;
  padding:16px 26px 16px 20px;
  text-shadow:0 2px 6px rgba(0,0,0,.9)}
.eyebrow{font-size:17px;letter-spacing:4px;color:#7fdfa4;margin-bottom:12px;white-space:nowrap}
.eyebrow .chev{color:#2bff7e}
.l1{font-size:23px;line-height:1.34;color:#eafff2}
.l1 b{color:#7fe9ff;font-weight:inherit}
.l2{font-size:21px;line-height:1.34;color:#8df0b0;margin-top:9px}
.l2 b{color:#ffd27a;font-weight:inherit}
.l3{font-size:18px;letter-spacing:1px;color:#6aa884;margin-top:13px}
</style></head><body>
<div class="card">
  <div class="eyebrow"><span class="chev">&raquo;&raquo;</span>&nbsp; ETK &nbsp;&middot;&nbsp; PRO TUNING</div>
  <div class="l1">An ETK Pro Tuning for <b>Gran Turismo 5 Prologue</b><br>by mercurious for Adreno 650</div>
  <div class="l2"><b>100 MB</b> of Turnip 26.1.0 SM8250 shaders earned<br>in 4&thinsp;hrs &amp; 87 crashes (93% productive)</div>
  <div class="l3">tooling at github.com/mercurious/etk</div>
</div>
</body></html>
